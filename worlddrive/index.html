<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WorldDrive — Real Roads</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071016;color:#eef8fb;font-family:Inter,system-ui,-apple-system,sans-serif}#map,#game{position:fixed;inset:0}#map{background:#122028;overflow:hidden;filter:saturate(.72) brightness(.72) contrast(1.08)}.tile{position:absolute;width:256px;height:256px;max-width:none;user-select:none;pointer-events:none}#game{z-index:2;pointer-events:none}.shade{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(2,8,12,.42) 100%)}.panel{position:fixed;z-index:5;background:rgba(5,15,21,.86);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);box-shadow:0 12px 40px #0008;border-radius:18px}.top{left:18px;top:18px;width:min(470px,calc(100vw - 36px));padding:14px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand b{font-size:20px;letter-spacing:.4px}.tag{font-size:11px;color:#7de3ef;border:1px solid #7de3ef55;border-radius:999px;padding:4px 8px}form{display:flex;gap:8px}input{flex:1;min-width:0;background:#0d1b22;color:white;border:1px solid #29414d;border-radius:12px;padding:11px 12px;outline:0}button,.link{background:#f2f7f8;color:#071016;border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer;text-decoration:none}.sub{display:flex;gap:10px;align-items:center;margin-top:10px;color:#9fb5be;font-size:12px;white-space:nowrap;overflow:hidden}.dot{width:8px;height:8px;border-radius:50%;background:#4fe18a;box-shadow:0 0 12px #4fe18a}.hud{right:18px;top:18px;padding:14px;width:210px}.speed{font-size:52px;font-weight:850;line-height:.9}.unit{font-size:11px;color:#9fb5be}.row{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #ffffff14;font-size:12px}.row b{font-size:13px}.health{height:5px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-top:8px}.health i{display:block;height:100%;background:#4fe18a;transform-origin:left}.bottom{left:18px;bottom:18px;padding:10px 12px;font-size:12px;color:#abc0c9}.bottom a{color:#8ce8f2;text-decoration:none;margin-left:10px}.actions{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;gap:8px}.actions button{background:#0c1b22;color:#eaf8fb;border:1px solid #ffffff1f}.mobile{display:none;position:fixed;z-index:8;bottom:22px;left:0;right:0;padding:0 18px;justify-content:space-between;pointer-events:none}.cluster{display:grid;grid-template-columns:62px 62px;gap:8px;pointer-events:auto}.mobile button{width:62px;height:62px;border-radius:18px;background:#081820cc;color:white;border:1px solid #ffffff30;font-size:24px;touch-action:none}.gas{display:grid;gap:8px;pointer-events:auto}.gas button{width:72px;height:62px}.loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#061016e8}.loading.hide{display:none}.loadbox{text-align:center}.spinner{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:#72e1ee;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 14px}@keyframes spin{to{transform:rotate(360deg)}}#toast{position:fixed;z-index:30;left:50%;top:90px;transform:translate(-50%,-15px);background:white;color:#071016;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.hud{top:auto;right:12px;bottom:165px;width:145px;padding:10px}.speed{font-size:36px}.top{left:10px;top:10px;width:calc(100vw - 20px)}.bottom,.actions{display:none}.mobile{display:flex}.brand b{font-size:17px}}
</style>
</head>
<body>
<div id="map"></div><canvas id="game"></canvas><div class="shade"></div>
<div class="panel top"><div class="brand"><b>WORLD<span style="color:#6fe3ef">DRIVE</span></b><span class="tag">REAL ROADS</span></div><form id="search"><input id="place" placeholder="Search city, road, landmark or lat,lng" value="Dubai"><button>DRIVE</button></form><div class="sub"><span class="dot"></span><span id="loc">Dubai</span><span id="road">loading roads…</span></div></div>
<div class="panel hud"><div><span id="speed" class="speed">0</span> <span class="unit">KM/H</span></div><div class="row"><span>Gear</span><b id="gear">N</b></div><div class="row"><span>Score</span><b id="score">0</b></div><div class="row"><span>Distance</span><b id="distance">0.00 km</b></div><div class="row"><span>Best</span><b id="best">0</b></div><div class="row"><span>Vehicle</span><b id="hp">100%</b></div><div class="health"><i id="health"></i></div></div>
<div class="panel bottom">WASD / arrows · Space handbrake · R reset <a id="gm" target="_blank">Google Maps</a><a id="sv" target="_blank">Street View</a></div>
<div class="actions"><button id="traffic">Traffic: ON</button><button id="reset">Reset car</button></div>
<div class="mobile"><div class="cluster"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button><button data-k="Space">◎</button></div><div class="gas"><button data-k="ArrowUp">▲</button><button data-k="ArrowDown">▼</button></div></div>
<div id="loading" class="loading"><div class="loadbox"><div class="spinner"></div><b id="loadingText">Loading real road network…</b></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),C=$('#game'),X=C.getContext('2d'),M=$('#map'),R=6378137,Z=17,T=256,keys=new Set();let W,H,dpr,origin={lat:25.2048,lng:55.2708,label:'Dubai'},roads=[],segs=[],traffic=[],trafficOn=true,last=performance.now(),acc=0,rev=0;const car={x:0,y:0,vx:0,vy:0,a:-1.57,steer:0,hp:100,dist:0,score:0,hit:0};const cache=new Map();
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function ll(lat,lng){let c=Math.cos(origin.lat*Math.PI/180);return{x:(lng-origin.lng)*Math.PI/180*R*c,y:-(lat-origin.lat)*Math.PI/180*R}}function geo(x,y){let c=Math.cos(origin.lat*Math.PI/180);return{lat:origin.lat-y/R*180/Math.PI,lng:origin.lng+x/(R*c)*180/Math.PI}}function mx(lon){return(lon+180)/360*2**Z}function my(lat){let r=lat*Math.PI/180;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*2**Z}function mpp(){return Math.cos(origin.lat*Math.PI/180)*2*Math.PI*R/(T*2**Z)}function scr(x,y){let p=1/mpp();return{x:W/2+(x-car.x)*p,y:H/2+(y-car.y)*p}}
function tiles(){let g=geo(car.x,car.y),tx=mx(g.lng),ty=my(g.lat),cx=Math.floor(tx),cy=Math.floor(ty),px=(tx-cx)*T,py=(ty-cy)*T,nx=Math.ceil(W/T/2)+2,ny=Math.ceil(H/T/2)+2,need=new Set;for(let y=-ny;y<=ny;y++)for(let x=-nx;x<=nx;x++){let k=Z+'/'+(cx+x)+'/'+(cy+y);need.add(k);let im=cache.get(k);if(!im){im=new Image;im.className='tile';im.referrerPolicy='no-referrer';im.src='https://tile.openstreetmap.org/'+k+'.png';M.append(im);cache.set(k,im)}im.style.left=(W/2-px+x*T)+'px';im.style.top=(H/2-py+y*T)+'px'}for(let [k,im] of cache)if(!need.has(k)){im.remove();cache.delete(k)}}
function nearest(x,y){let best=1e9,s=null,t=0;for(let q of segs){let vx=q.b.x-q.a.x,vy=q.b.y-q.a.y,l=vx*vx+vy*vy,u=l?((x-q.a.x)*vx+(y-q.a.y)*vy)/l:0;u=Math.max(0,Math.min(1,u));let d=Math.hypot(x-(q.a.x+u*vx),y-(q.a.y+u*vy));if(d<best){best=d;s=q;t=u}}return{d:best,s,t}}function snap(){let n=nearest(0,0);if(n.s){car.x=n.s.a.x+(n.s.b.x-n.s.a.x)*n.t;car.y=n.s.a.y+(n.s.b.y-n.s.a.y)*n.t;car.a=Math.atan2(n.s.b.y-n.s.a.y,n.s.b.x-n.s.a.x)}else car.x=car.y=0;car.vx=car.vy=0}
function seed(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>((h=Math.imul(h^h>>>15,1|h))>>>0)/4294967296}function spawn(){traffic=[];let r=seed(origin.label),n=Math.min(38,Math.max(12,Math.floor(roads.length/5)));for(let j=0;j<n;j++){let ri=Math.floor(r()*roads.length),w=roads[ri];if(!w||w.p.length<2)continue;traffic.push({ri,i:Math.floor(r()*(w.p.length-1)),t:r(),dir:r()>.5?1:-1,v:6+r()*13,h:r()*360})}}function pose(t){let w=roads[t.ri],a=w?.p[t.i],b=w?.p[t.i+1];return a&&b?{x:a.x+(b.x-a.x)*t.t,y:a.y+(b.y-a.y)*t.t,a:Math.atan2(b.y-a.y,b.x-a.x)+(t.dir<0?Math.PI:0)}:null}function moveTraffic(dt){if(!trafficOn)return;for(let t of traffic){let w=roads[t.ri],a=w.p[t.i],b=w.p[t.i+1],l=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));t.t+=t.dir*t.v*dt/l;if(t.t>1){t.i++;t.t=0;if(t.i>=w.p.length-1){t.i=w.p.length-2;t.dir=-1;t.t=1}}if(t.t<0){t.i--;t.t=1;if(t.i<0){t.i=0;t.dir=1;t.t=0}}}}
function saveBest(){let b=+localStorage.getItem('worlddrive-best')||0;if(car.score>b){b=car.score;localStorage.setItem('worlddrive-best',b)}$('#best').textContent=b.toLocaleString()}saveBest();
function reset(){saveBest();car.hp=100;car.dist=car.score=car.hit=0;snap();toast('Car reset')}
function step(dt){let up=keys.has('ArrowUp')||keys.has('KeyW'),dn=keys.has('ArrowDown')||keys.has('KeyS'),le=keys.has('ArrowLeft')||keys.has('KeyA'),ri=keys.has('ArrowRight')||keys.has('KeyD'),br=keys.has('Space'),v=Math.hypot(car.vx,car.vy),fwd=car.vx*Math.cos(car.a)+car.vy*Math.sin(car.a),n=nearest(car.x,car.y),on=n.d<15,grip=on?1:.46,max=on?41:18,th=(up?1:0)-(dn?1:0),st=(le?-1:0)+(ri?1:0);car.steer+=(st-car.steer)*Math.min(1,dt*8);if(th){let force=th*(on?9.5:4)*(1-Math.min(Math.abs(fwd)/max,.82));car.vx+=Math.cos(car.a)*force*dt;car.vy+=Math.sin(car.a)*force*dt}car.a+=car.steer*1.55*grip*Math.min(1,Math.abs(fwd)/5)*dt*(fwd>=0?1:-1);let fx=Math.cos(car.a),fy=Math.sin(car.a),rx=-fy,ry=fx,F=car.vx*fx+car.vy*fy,S=car.vx*rx+car.vy*ry,k=Math.max(0,1-dt*(on?7.8:2));car.vx=fx*F+rx*S*k;car.vy=fy*F+ry*S*k;let drag=Math.max(0,1-dt*(br?4.5:on?.42:1.05));car.vx*=drag;car.vy*=drag;v=Math.hypot(car.vx,car.vy);if(v>max){car.vx*=max/v;car.vy*=max/v}car.x+=car.vx*dt;car.y+=car.vy*dt;car.dist+=v*dt;car.score=Math.max(0,Math.floor(car.dist*1.5+(on?v*.35:0)-(100-car.hp)*10));if(car.hit>0)car.hit-=dt;moveTraffic(dt);if(trafficOn&&car.hit<=0)for(let t of traffic){let p=pose(t);if(p&&Math.hypot(p.x-car.x,p.y-car.y)<4.2){car.hp=Math.max(0,car.hp-18);car.vx*=-.25;car.vy*=-.25;car.hit=.8;toast('Collision -18%');break}}if(car.hp<=0)setTimeout(reset,300)}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}function draw(){X.clearRect(0,0,W,H);let p=1/mpp();X.lineCap='round';X.lineJoin='round';for(let r of roads){X.beginPath();let on=false;for(let q of r.p){let s=scr(q.x,q.y);if(!on){X.moveTo(s.x,s.y);on=true}else X.lineTo(s.x,s.y)}X.strokeStyle='rgba(91,214,240,.13)';X.lineWidth=Math.max(2,5*p);X.stroke()}if(trafficOn)for(let t of traffic){let q=pose(t);if(!q)continue;let s=scr(q.x,q.y);if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30)continue;X.save();X.translate(s.x,s.y);X.rotate(q.a+Math.PI/2);let w=Math.max(5,1.8*p),h=Math.max(10,4.3*p);X.fillStyle='hsl('+t.h+' 65% 55%)';X.fillRect(-w/2,-h/2,w,h);X.fillStyle='#a9e3f2';X.fillRect(-w*.34,-h*.1,w*.68,h*.2);X.restore()}X.save();X.translate(W/2,H/2);X.rotate(car.a+Math.PI/2);let w=Math.max(10,1.95*p),h=Math.max(22,4.5*p);X.shadowColor='#f1455588';X.shadowBlur=16;X.fillStyle='#f14555';rr(-w/2,-h/2,w,h,w*.25);X.fill();X.shadowBlur=0;X.fillStyle='#82d8ef';rr(-w*.34,-h*.18,w*.68,h*.25,w*.08);X.fill();X.restore();let kph=Math.round(Math.hypot(car.vx,car.vy)*3.6);$('#speed').textContent=kph;$('#gear').textContent=fwdGear(kph);$('#score').textContent=car.score.toLocaleString();$('#distance').textContent=(car.dist/1000).toFixed(2)+' km';$('#hp').textContent=Math.round(car.hp)+'%';$('#health').style.transform='scaleX('+(car.hp/100)+')';tiles()}
function fwdGear(k){let f=car.vx*Math.cos(car.a)+car.vy*Math.sin(car.a);return f<-1?'R':k<2?'N':k<35?'1':k<70?'2':k<110?'3':'4'}function loop(now){let f=Math.min(.05,(now-last)/1000);last=now;acc+=f;while(acc>=1/60){step(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1300)}async function geocode(q){let m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(m)return{lat:+m[1],lng:+m[2],label:q};let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));let d=await r.json();if(!d[0])throw Error('Location not found');return{lat:+d[0].lat,lng:+d[0].lon,label:(d[0].display_name||q).split(',').slice(0,3).join(',')}}async function load(lat,lng,label){let id=++rev;$('#loading').classList.remove('hide');$('#loadingText').textContent='Loading '+label+' roads…';origin={lat,lng,label};$('#loc').textContent=label;try{let q='[out:json][timeout:20];way(around:1500,'+lat+','+lng+')["highway"]["highway"!~"footway|path|steps|cycleway|construction|proposed|raceway"];out geom;',r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:q})}),d=await r.json();if(id!==rev)return;roads=(d.elements||[]).map(w=>({p:(w.geometry||[]).map(g=>ll(g.lat,g.lon))})).filter(w=>w.p.length>1);segs=[];for(let w of roads)for(let i=0;i<w.p.length-1;i++)segs.push({a:w.p[i],b:w.p[i+1]});snap();spawn();reset();$('#road').textContent=roads.length+' road ways · '+segs.length+' segments';localStorage.setItem('worlddrive-spawn',JSON.stringify(origin));toast('Driving in '+label.split(',')[0])}catch(e){$('#road').textContent='road service unavailable — try again';toast('Could not load roads')}finally{$('#loading').classList.add('hide')}}
$('#search').onsubmit=async e=>{e.preventDefault();try{let p=await geocode($('#place').value.trim());load(p.lat,p.lng,p.label)}catch(e){toast(e.message)}};$('#traffic').onclick=()=>{trafficOn=!trafficOn;$('#traffic').textContent='Traffic: '+(trafficOn?'ON':'OFF')};$('#reset').onclick=reset;addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyR'].includes(e.code)){if(document.activeElement.tagName!=='INPUT')e.preventDefault();keys.add(e.code);if(e.code==='KeyR')reset()}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k,on=e=>{e.preventDefault();keys.add(k)},off=e=>{e.preventDefault();keys.delete(k)};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off});setInterval(()=>{let g=geo(car.x,car.y),lat=g.lat.toFixed(6),lng=g.lng.toFixed(6);$('#gm').href='https://www.google.com/maps/search/?api=1&query='+lat+','+lng;$('#sv').href='https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+lat+','+lng;saveBest()},1000);let s;try{s=JSON.parse(localStorage.getItem('worlddrive-spawn'))}catch{};load(s?.lat||origin.lat,s?.lng||origin.lng,s?.label||origin.label);requestAnimationFrame(loop);
</script>
</body></html>
