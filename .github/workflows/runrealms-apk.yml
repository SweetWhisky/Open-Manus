name: Build RUN REALMS APK

on:
  push:
    branches: [run-realms-apk-build]
    paths:
      - 'runrealms/**'
      - '.github/workflows/runrealms-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: runrealms
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp runrealms/app/build/outputs/apk/debug/app-debug.apk RUN-REALMS-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RUN-REALMS-v0.1.0-APK
          path: RUN-REALMS-v0.1.0.apk
          retention-days: 30
