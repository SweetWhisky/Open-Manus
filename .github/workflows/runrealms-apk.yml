name: Build and Publish RUN REALMS APK

on:
  push:
    branches: [main, run-realms-apk-build]
    paths:
      - 'runrealms/**'
      - '.github/workflows/runrealms-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runrealms/**'
      - '.github/workflows/runrealms-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-realms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate game scripts
        run: |
          node --check runrealms/app/src/main/assets/game-core.js
          node --check runrealms/app/src/main/assets/game-engine.js
          node --check runrealms/app/src/main/assets/game-ui.js

      - name: Lint and build signed release APK
        working-directory: runrealms
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and package APK
        run: |
          cp runrealms/app/build/outputs/apk/release/app-release.apk RUN-REALMS-v0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs RUN-REALMS-v0.1.0.apk
          sha256sum RUN-REALMS-v0.1.0.apk > RUN-REALMS-v0.1.0.apk.sha256
          zip -j RUN-REALMS-web-preview.zip runrealms/app/src/main/assets/index.html runrealms/app/src/main/assets/style.css runrealms/app/src/main/assets/game-core.js runrealms/app/src/main/assets/game-engine.js runrealms/app/src/main/assets/game-ui.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUN-REALMS-v0.1.0-APK
          path: |
            RUN-REALMS-v0.1.0.apk
            RUN-REALMS-v0.1.0.apk.sha256
            RUN-REALMS-web-preview.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: run-realms-v0.1.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'RUN//REALMS v0.1.0' \
              --notes 'Direct Android sideload test release. Includes deterministic seeded runs, five realms, adaptive difficulty, focus mode, local progression, accessibility settings, and an optional adult-only non-explicit content toggle. The APK is test-signed for direct QA installation and is not a Google Play production build.'
          fi
          gh release upload "$TAG" \
            RUN-REALMS-v0.1.0.apk \
            RUN-REALMS-v0.1.0.apk.sha256 \
            RUN-REALMS-web-preview.zip \
            --clobber
